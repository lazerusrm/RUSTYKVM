[package]
name = "nanokvm-server"
version = "0.2.20"
edition = "2021"
license = "GPL-3.0"
description = "Rust implementation of NanoKVM server - IP-KVM for remote machine control"
repository = "https://github.com/lazerusrm/RUSTYKVM"
keywords = ["kvm", "ip-kvm", "remote-access", "nanokvm"]
categories = ["network-programming", "hardware-support"]

[features]
default = []

[dependencies]
kvm = { path = "../kvm" }
hid = { path = "../hid" }
vm = { path = "../vm" }
storage = { path = "../storage" }
network = { path = "../network" }
audio = { path = "../audio", optional = true }
tokio = { version = "1.43", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
axum = { version = "0.8", features = ["ws", "multipart"] }
axum-server = { version = "0.7", features = ["tls-rustls"] }
tower-http = { version = "0.6", features = ["fs", "trace", "set-header", "cors", "compression-full"] }
libc = "0.2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
bytes = "1.9"
futures = "0.3"
webrtc = "0.11"
opus = { version = "0.3", optional = true }
subtle = "2.4"
aes = "0.8"
cbc = "0.1"
ring = "0.17"
walkdir = "2.3"
zip = "2.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
uuid = { version = "1.0", features = ["v4"] }
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "stream"] }
url = "2.5"
anyhow = "1.0"
thiserror = "2.0"
parking_lot = "0.12"
rand = "0.8"
tokio-util = { version = "0.7", features = ["io"] }
bcrypt = "0.15"
jsonwebtoken = "9.3"
axum-extra = { version = "0.10", features = ["cookie"] }
get_if_addrs = "0.5"
portable-pty = "0.8"
sha2 = "0.10"
flate2 = "1.0"
tar = "0.4"
md5 = "0.7"
memchr = "2.7"
fs_extra = "1.3"
chrono = "0.4"
cipher = "0.4"
once_cell = "1.19"
regex = "1.10"
qrcode = "0.14"
byteorder = "1.5"
socket2 = "0.5"
itoa = "1.0"
urlencoding = "2.1"

# Platform-specific dependencies
# TLS dependencies - ring works on all platforms including RISC-V
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[target.'cfg(target_os = "linux")'.dependencies]
rustls-pemfile = "2"
tokio-rustls = "0.26"

[target.'cfg(not(target_os = "linux"))'.dependencies]

name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # Host toolchain checks must not use the default RISC-V target from .cargo/config.toml
  HOST_TARGET: x86_64-unknown-linux-gnu

jobs:
  quality:
    name: Quality (fmt, clippy, test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: host-${{ env.HOST_TARGET }}
          save-if: true

      - name: Verify shell scripts use LF
        run: |
          if grep -r $'\r' scripts/S95nanokvm scripts/install.sh scripts/verify-device.sh; then
            echo "ERROR: shell scripts must use LF line endings (see .gitattributes)"
            exit 1
          fi

      - name: cargo fmt
        run: cargo fmt --all -- --check

      - name: cargo clippy (zero warnings)
        run: cargo clippy --workspace --all-targets --target ${{ env.HOST_TARGET }} -- -D warnings

      - name: cargo test
        run: cargo test --workspace --target ${{ env.HOST_TARGET }} --exclude audio

      - name: Verify release bundle inputs
        run: |
          test -x scripts/install.sh
          test -f scripts/S95nanokvm
          head -1 scripts/S95nanokvm | grep -q '^#!/bin/sh$'

  build-riscv:
    name: Build (RISC-V musl)
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-musl

      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: riscv-musl
          save-if: true

      - name: Install musl cross-compiler
        run: |
          wget -q https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz -O /tmp/host-tools.tar.gz
          sudo mkdir -p /opt/riscv-musl
          sudo tar -xzf /tmp/host-tools.tar.gz -C /opt/riscv-musl --strip-components=1
          echo "/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin" >> "$GITHUB_PATH"

      - name: Install lld linker wrapper
        run: |
          cat > /tmp/riscv64-linux-musl-ld << 'EOF'
          #!/bin/bash
          exec ld.lld "$@"
          EOF
          chmod +x /tmp/riscv64-linux-musl-ld
          sudo apt-get update
          sudo apt-get install -y lld
          BINUTILS_DIR="/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/riscv64-unknown-linux-musl/bin"
          MAIN_BIN="/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin"
          for d in "$BINUTILS_DIR" "$MAIN_BIN"; do
            if [ -f "$d/ld" ]; then
              sudo mv "$d/ld" "$d/ld.bak"
              sudo cp /tmp/riscv64-linux-musl-ld "$d/ld"
            fi
            if [ -f "$d/riscv64-unknown-linux-musl-ld" ]; then
              sudo mv "$d/riscv64-unknown-linux-musl-ld" "$d/riscv64-unknown-linux-musl-ld.bak"
              sudo cp /tmp/riscv64-linux-musl-ld "$d/riscv64-unknown-linux-musl-ld"
            fi
          done

      - name: cargo build (release)
        env:
          CC_riscv64gc_unknown_linux_musl: riscv64-unknown-linux-musl-gcc
          CXX_riscv64gc_unknown_linux_musl: riscv64-unknown-linux-musl-g++
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: riscv64-unknown-linux-musl-gcc
          RUSTFLAGS: "-C target-feature=-v"
        run: |
          export PATH="/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin:$PATH"
          cargo build -p nanokvm-server --release --target riscv64gc-unknown-linux-musl

      - name: Verify musl binary
        run: |
          file target/riscv64gc-unknown-linux-musl/release/nanokvm-server
          readelf -h target/riscv64gc-unknown-linux-musl/release/nanokvm-server | head -5

      - uses: actions/upload-artifact@v4
        with:
          name: nanokvm-server-riscv64-musl
          path: target/riscv64gc-unknown-linux-musl/release/nanokvm-server
          if-no-files-found: error

  e2e-device:
    name: E2E (device)
    needs: quality
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: e2e/package-lock.json

      - name: Install Playwright
        working-directory: e2e
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Run smoke tests
        working-directory: e2e
        env:
          NANOKVM_BASE_URL: ${{ vars.NANOKVM_BASE_URL || 'http://192.168.0.84' }}
          NANOKVM_USER: ${{ secrets.NANOKVM_USER || 'admin' }}
          NANOKVM_PASS: ${{ secrets.NANOKVM_PASS || 'admin' }}
        run: npm test

  release:
    name: Release
    needs: build-riscv
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: nanokvm-server-riscv64-musl
          path: binary/

      - name: Build upgrade tarball
        run: |
          VERSION="${GITHUB_REF_NAME}"
          mkdir -p package
          cp binary/nanokvm-server package/nanokvm-server
          chmod +x package/nanokvm-server
          cp scripts/S95nanokvm package/
          cp scripts/install.sh package/
          chmod +x package/install.sh
          echo "${VERSION}" > package/RELEASE_VERSION
          cd package && tar -czf "../nanokvm-rs-${VERSION}-upgrade.tar.gz" . && cd ..
          ASSET="nanokvm-rs-${VERSION}-upgrade.tar.gz"
          SIZE=$(stat -c%s "${ASSET}")
          SHA512=$(openssl dgst -sha512 -binary "${ASSET}" | base64 -w0)
          printf '{"version":"%s","name":"%s","sha512":"%s","size":%s}\n' \
            "${VERSION}" "${ASSET}" "${SHA512}" "${SIZE}" > latest.json

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            nanokvm-rs-*-upgrade.tar.gz
            latest.json
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
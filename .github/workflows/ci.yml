name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        # Use native target to override .cargo/config.toml's riscv64 target
        run: cargo clippy --workspace --target x86_64-unknown-linux-gnu -- -D warnings
        continue-on-error: true

  build-riscv:
    name: Build (RISC-V musl)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-musl

      - name: Download and install musl cross-compiler
        run: |
          # Download Sophgo/Sipeed's musl-based RISC-V toolchain
          echo "Downloading musl toolchain..."
          wget -q https://sophon-file.sophon.cn/sophon-prod-s3/drive/23/03/07/16/host-tools.tar.gz -O /tmp/host-tools.tar.gz

          echo "Extracting toolchain..."
          sudo mkdir -p /opt/riscv-musl
          sudo tar -xzf /tmp/host-tools.tar.gz -C /opt/riscv-musl --strip-components=1

          echo "Toolchain contents:"
          ls -la /opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin/ | head -20

          # Add to PATH
          echo "/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin" >> $GITHUB_PATH

      - name: Verify toolchain
        run: |
          export PATH="/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin:$PATH"
          which riscv64-unknown-linux-musl-gcc
          riscv64-unknown-linux-musl-gcc --version

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-riscv-musl-${{ hashFiles('**/Cargo.lock') }}

      - name: Create linker wrapper script
        run: |
          # Create a wrapper that uses lld instead of GNU ld
          # This avoids the ISA extension compatibility issues with old GCC binutils
          cat > /tmp/riscv64-linux-musl-ld << 'WRAPPER'
          #!/bin/bash
          # Wrapper to use ld.lld instead of GNU ld for RISC-V linking
          # Converts GNU ld args to lld-compatible args
          exec ld.lld "$@"
          WRAPPER
          chmod +x /tmp/riscv64-linux-musl-ld
          sudo apt-get update
          sudo apt-get install -y lld

      - name: Build for RISC-V (musl)
        env:
          CC_riscv64gc_unknown_linux_musl: riscv64-unknown-linux-musl-gcc
          CXX_riscv64gc_unknown_linux_musl: riscv64-unknown-linux-musl-g++
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: riscv64-unknown-linux-musl-gcc
          # Disable vector extension - C906 uses RVV 0.7, not RVV 1.0
          RUSTFLAGS: "-C target-feature=-v"
        run: |
          export PATH="/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin:$PATH"

          # Replace the binutils ld with our lld wrapper
          BINUTILS_DIR="/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/riscv64-unknown-linux-musl/bin"
          if [ -f "$BINUTILS_DIR/ld" ]; then
            sudo mv "$BINUTILS_DIR/ld" "$BINUTILS_DIR/ld.bak"
            sudo cp /tmp/riscv64-linux-musl-ld "$BINUTILS_DIR/ld"
          fi

          # Also check the main bin directory
          MAIN_BIN="/opt/riscv-musl/gcc/riscv64-linux-musl-x86_64/bin"
          if [ -f "$MAIN_BIN/riscv64-unknown-linux-musl-ld" ]; then
            sudo mv "$MAIN_BIN/riscv64-unknown-linux-musl-ld" "$MAIN_BIN/riscv64-unknown-linux-musl-ld.bak"
            sudo cp /tmp/riscv64-linux-musl-ld "$MAIN_BIN/riscv64-unknown-linux-musl-ld"
          fi

          cargo build --workspace --release --target riscv64gc-unknown-linux-musl

      - name: Verify binary
        run: |
          echo "Binary info:"
          ls -la target/riscv64gc-unknown-linux-musl/release/nanokvm-server
          file target/riscv64gc-unknown-linux-musl/release/nanokvm-server
          # Check it's musl-linked
          readelf -d target/riscv64gc-unknown-linux-musl/release/nanokvm-server 2>/dev/null | head -20 || true

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: nanokvm-binary
          path: target/riscv64gc-unknown-linux-musl/release/nanokvm-server
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-riscv
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download binary
        uses: actions/download-artifact@v4
        with:
          name: nanokvm-binary
          path: binary/

      - name: Create upgrade package
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          mkdir -p package
          cp binary/nanokvm-server package/nanokvm-server
          chmod +x package/nanokvm-server
          cp scripts/S95nanokvm package/S95nanokvm

          # Create simple install script
          cat > package/install.sh << 'INSTALL'
          #!/bin/sh
          set -e
          echo "Installing NanoKVM-RS..."

          # When invoked by the in-device auto-updater, skipping service control is required:
          # stopping the service here would kill the updater process mid-install.
          if [ "${NANOKVM_SKIP_SERVICE:-0}" != "1" ]; then
            /etc/init.d/S95nanokvm stop 2>/dev/null || true
          fi

          # Backup original
          if [ -f /kvmapp/nanokvm-server ]; then
            cp /kvmapp/nanokvm-server /kvmapp/nanokvm-server.bak
          fi

          # Install new binary
          cp nanokvm-server /kvmapp/nanokvm-server.new
          chmod +x /kvmapp/nanokvm-server.new
          mv -f /kvmapp/nanokvm-server.new /kvmapp/nanokvm-server

          # Install init script (hardened)
          cp S95nanokvm /etc/init.d/S95nanokvm
          chmod +x /etc/init.d/S95nanokvm

          # Record version for /api/application/version
          echo "__VERSION__" > /kvmapp/version

          if [ "${NANOKVM_SKIP_SERVICE:-0}" != "1" ]; then
            /etc/init.d/S95nanokvm start
          fi

          echo "Done! NanoKVM-RS installed."
          INSTALL
          sed -i "s/__VERSION__/${VERSION}/g" package/install.sh
          chmod +x package/install.sh

          cd package
          tar -czvf ../nanokvm-rs-${VERSION}-upgrade.tar.gz .
          cd ..
          sha256sum nanokvm-rs-${VERSION}-upgrade.tar.gz > nanokvm-rs-${VERSION}-upgrade.tar.gz.sha256

          # Create latest.json compatible with the in-device updater.
          ASSET="nanokvm-rs-${VERSION}-upgrade.tar.gz"
          SIZE="$(stat -c%s "${ASSET}")"
          SHA512="$(openssl dgst -sha512 -binary "${ASSET}" | base64 -w0)"
          cat > latest.json <<EOF
          {"version":"${VERSION}","name":"${ASSET}","sha512":"${SHA512}","size":${SIZE}}
          EOF

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nanokvm-rs-*-upgrade.tar.gz
            nanokvm-rs-*-upgrade.tar.gz.sha256
            latest.json
          generate_release_notes: false
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          body: |
            ## NanoKVM-RS ${{ github.ref_name }}

            High-performance Rust rewrite of the NanoKVM server.

            ### Performance vs Go Version

            | Metric | Go | Rust | Improvement |
            |--------|-----|------|-------------|
            | Input Latency | 30-80ms | 13-16ms | 3-4x faster |
            | Video TTFB | ~50ms | 29-47ms | ~40% faster |
            | RAM Usage | 24 MB | 14.5 MB | 40% less |

            ### Installation

            ```bash
            # Upload to device
            scp nanokvm-rs-${{ github.ref_name }}-upgrade.tar.gz root@<nanokvm-ip>:/tmp/

            # Install
            ssh root@<nanokvm-ip> "cd /tmp && tar -xzf nanokvm-rs-*-upgrade.tar.gz && ./install.sh"
            ```

            ### Key Features

            - Lazy hardware initialization (no crash without HDMI)
            - TCP_NODELAY for lower latency
            - Reduced memory footprint
            - H.264 hardware encoding via WebRTC

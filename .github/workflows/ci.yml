name: CI/CD Pipeline

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: Check & Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-check-${{ hashFiles('**/Cargo.lock') }}

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace -- -D warnings
        continue-on-error: true

  build-riscv:
    name: Build (RISC-V)
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: riscv64gc-unknown-linux-gnu

      - name: Install cross-compilation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-riscv64-linux-gnu g++-riscv64-linux-gnu

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-riscv-${{ hashFiles('**/Cargo.lock') }}

      - name: Build for RISC-V
        env:
          CC_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-gcc
          CXX_riscv64gc_unknown_linux_gnu: riscv64-linux-gnu-g++
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_GNU_LINKER: riscv64-linux-gnu-gcc
        run: cargo build --workspace --release --target riscv64gc-unknown-linux-gnu

      - name: Create deployment package
        run: |
          mkdir -p package
          cp target/riscv64gc-unknown-linux-gnu/release/nanokvm-server package/
          cp -r web package/
          cp scripts/install.sh package/
          chmod +x package/install.sh
          chmod +x package/nanokvm-server

      - name: Upload deployment package
        uses: actions/upload-artifact@v4
        with:
          name: nanokvm-deploy
          path: package/
          if-no-files-found: error

  release:
    name: Create Release
    runs-on: ubuntu-latest
    needs: build-riscv
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download deployment package
        uses: actions/download-artifact@v4
        with:
          name: nanokvm-deploy
          path: package/

      - name: Create release tarball
        run: |
          VERSION=${GITHUB_REF#refs/tags/}
          cd package
          tar -czvf ../nanokvm-rs-${VERSION}-riscv64.tar.gz .
          cd ..
          sha256sum nanokvm-rs-${VERSION}-riscv64.tar.gz > nanokvm-rs-${VERSION}-riscv64.tar.gz.sha256

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            nanokvm-rs-*-riscv64.tar.gz
            nanokvm-rs-*-riscv64.tar.gz.sha256
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') || contains(github.ref, '-alpha') }}
          body: |
            ## Installation

            1. Download `nanokvm-rs-${{ github.ref_name }}-riscv64.tar.gz`
            2. Copy to your NanoKVM device
            3. Extract and run the install script:

            ```bash
            tar -xzf nanokvm-rs-*.tar.gz
            cd nanokvm-rs-*
            sudo ./install.sh
            ```

            ## What's Included

            - `nanokvm-server` - Main server binary (RISC-V)
            - `web/` - Web UI assets
            - `install.sh` - Installation script
